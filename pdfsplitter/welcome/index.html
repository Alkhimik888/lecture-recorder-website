<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF Splitter is installed</title>
<link rel="icon" href="../icon/icon-32.png">
<!-- No analytics here by lead decision Р-38: this page is bundled, opens once on install,
     and a counter on an install-triggered page is exactly the profiling risk the CWS user-data
     policy names. Install numbers come from the Chrome Web Store dashboard instead. -->
<link rel="stylesheet" href="welcome.css">
</head>
<body>

<main class="welcome-shell">
  <h1>
    <button class="party" id="party" type="button" aria-label="Confetti">🎉</button>
    <span class="brand" data-i18n="welcomeName">PDF Splitter</span> <span data-i18n="welcomeIsInstalled">is installed!</span>
  </h1>

  <p class="line"><span class="n">1</span> <span data-i18n="welcomeStep1">Click the puzzle piece in the top right of your browser.</span></p>
  <p class="line"><span class="n">2</span> <span data-i18n="welcomeStep2">Then, click the little pin next to the extension:</span></p>
  <img class="shot" src="./shot-pin.png" alt="Chrome window: the puzzle button (1) opens the light Extensions menu; the pin (2) next to PDF Splitter keeps its icon on the toolbar">

  <p class="line"><span class="n">3</span> <span data-i18n="welcomeStep3">Click the highlighted icon - the workspace opens: drop a PDF to split, extract, remove or rotate pages:</span></p>
  <img class="shot" src="./shot-click.png" alt="Chrome window with the pinned PDF Splitter icon highlighted on the toolbar (3)">
</main>

<script src="./welcome.js"></script>
</body>
</html>
